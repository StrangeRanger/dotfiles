###
### Optimized for general-purpose large-file downloads (>1 GiB).
###

## Resume interrupted HTTP/HTTPS/FTP downloads.
continue=true

## Use moderate parallelism for higher throughput.
max-connection-per-server=8
split=8
min-split-size=16M

## Be resilient to temporary network/server failures.
max-tries=10
retry-wait=3
connect-timeout=15

## Begin large downloads immediately rather than preallocating them.
file-allocation=none
